name: Release

# Tag-triggered. Publishes an ad-hoc signed, unnotarized .zip — which is the
# distribution AgentBar has, not a shortfall it is waiting out: there is no Apple
# Developer Program membership, so source is the primary channel and the download
# is a convenience (ADR-0015). The signing path below is kept live and dormant so
# that acquiring a certificate is a change of secrets, not of pipeline.
#
# Required secrets once signing is enabled (step 13):
#   APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Must match ci.yml. A distributable built against an unknown SDK is not
  # reproducible, so this selection is fatal here where CI only warns.
  XCODE_VERSION: '26.6'

jobs:
  # A tag can point at any commit, including one whose CI run was skipped.
  # The distributable artifact is exactly what must not escape the ToS boundary,
  # so the guard runs here too — 1x runner, ~30s.
  guard:
    name: Policy guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ToS boundary scan
        run: ./scripts/tos-scan.sh

  release:
    needs: guard
    # Pinned for the same reason as CI: the distributable must be built against
    # a known SDK, not against whatever macos-latest rotates to.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          set -uo pipefail
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$app" ]; then
            sudo xcode-select -s "$app"
          fi
          # Asserts the effective version, not the presence of a directory: a
          # xcode-select that silently failed would otherwise pass. A release
          # must never be built against an unverified SDK.
          # `xcodebuild -version | head -1` is a trap: head closes the pipe after
          # the first line, xcodebuild takes EPIPE on the second, and it does not
          # handle that — it throws NSFileHandleOperationException and aborts with
          # 134. The race is usually won on a fast machine and lost on a runner.
          # Capture the whole output and split it in the shell instead.
          version_output=$(xcodebuild -version)
          selected=${version_output%%$'\n'*}
          echo "$selected"
          if [ "$selected" != "Xcode ${XCODE_VERSION}" ]; then
            echo "::error::Expected Xcode ${XCODE_VERSION}, got '${selected}'. Available:"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

      - name: Detect signing capability
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -n "${CERT:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple Developer secrets absent — producing an ad-hoc signed, unnotarized build. This is the expected path today (ADR-0015); recipients clear quarantine themselves."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No idle auto-lock: codesign runs later, inside build-release.sh, and a
          # cold build can exceed any short timeout — that failure surfaces as an
          # opaque errSecInternalComponent. The keychain is deleted in cleanup.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # Path only — never the password.
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      # `make lint` needs swiftlint and `make verify-bundle` needs xcodegen;
      # neither ships on the image. xcbeautify does, and swift-format comes with
      # the toolchain. Same line as ci.yml, deliberately.
      - name: Install tooling
        run: brew install xcodegen swiftlint

      # The guard job above exists because a tag can point at a commit whose CI
      # run was skipped. The same argument covers the suite: without this, a tag
      # on a red commit produces a published download. `check` is lint, tests,
      # the ToS scan and the generated-model check.
      #
      # `CONFIGURATION=Release` is not optional here. Debug and Release land in
      # different derived-data trees and share no compiled module, so verifying
      # Debug would build the whole app a second time and certify a bundle that
      # is not the one being published. With Release, `build-release.sh`'s own
      # `make verify-bundle CONFIGURATION=Release` is the warm no-op it is meant
      # to be — one build per release, on a runner billed by the minute.
      - name: Test and verify the bundle
        run: |
          set -euo pipefail
          make check
          make verify-bundle CONFIGURATION=Release

      - name: Build release
        env:
          SIGNING_ENABLED: ${{ steps.signing.outputs.enabled }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/build-release.sh

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: ./scripts/notarize.sh

      # Runs before the third-party publish action, so the signing key is gone
      # from the runner by the time any non-first-party code executes.
      - name: Destroy signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security list-keychains -d user -s login.keychain-db
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi

      # Composed in a step, not in the publish action's `body:`. A GitHub
      # expression cannot hold a multi-line string, and these notes are the only
      # place a person downloading an unsigned build is told how to open it.
      - name: Compose release notes
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            cat > dist/RELEASE_NOTES.md <<'SIGNED_NOTES'
          Signed with a Developer ID and notarized by Apple.
          SIGNED_NOTES
          else
            cat > dist/RELEASE_NOTES.md <<'UNSIGNED_NOTES'
          ### Unsigned build

          AgentBar has no Apple Developer Program membership, so this download is
          **ad-hoc signed and not notarized**. macOS quarantines what a browser
          downloads, and Gatekeeper refuses an unnotarized app until that attribute
          is removed:

          ```bash
          shasum -a 256 -c AgentBar-*.zip.sha256   # catches a corrupted download
          unzip AgentBar-*.zip
          rm -rf /Applications/AgentBar.app        # only when updating; quit it first
          mv AgentBar.app /Applications/
          xattr -d -r com.apple.quarantine /Applications/AgentBar.app
          open /Applications/AgentBar.app
          ```

          If `xattr` reports `option -r not recognized`, a pip-installed `xattr` is
          shadowing the system one — use `/usr/bin/xattr` explicitly.

          The checksum is published by this same job and nothing signs either file,
          so it proves the download arrived intact and nothing more.

          **Building from source avoids all of this.** A locally built bundle is never
          quarantined, and it is the channel this project recommends:

          ```bash
          make bootstrap && make install
          ```
          UNSIGNED_NOTES
          fi
          cat dist/RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/AgentBar-*.zip
            dist/AgentBar-*.zip.sha256
          fail_on_unmatched_files: true
          draft: true
          generate_release_notes: true
          body_path: dist/RELEASE_NOTES.md

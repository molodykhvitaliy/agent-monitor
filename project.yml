# Generated into AgentBar.xcodeproj by `make generate`; the project itself is
# never committed (ADR-0003). Change this file, never the .xcodeproj.
#
# Only the two bundles live here. Everything with logic in it is an SPM module
# in Package.swift so `swift test` runs it without an Xcode build.

name: AgentBar

options:
  bundleIdPrefix: com.molodykhvitalii
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.42.0"

packages:
  # The repository root is the package. Xcode resolves it as a local package, so
  # a module edit rebuilds without any publish step.
  AgentBar:
    path: .

configs:
  Debug: debug
  Release: release

settings:
  base:
    # Bumped by hand, and asserted against the tag: scripts/build-release.sh
    # refuses to package when a `v*` tag disagrees with this, because a download
    # named one version and reporting another is invisible afterwards.
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

    # Swift 6 language mode. Xcode derives SWIFT_STRICT_CONCURRENCY=complete from
    # it, so strict concurrency needs no per-target opt-in; it is restated below
    # only to keep the guarantee visible in a diff.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

    ALWAYS_SEARCH_USER_PATHS: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_OBJC_WEAK: YES

    # Ad-hoc signing is the distribution decision, not a placeholder: AgentBar is
    # given away as source and as an unsigned build, so a clean checkout has to
    # be buildable with no Apple Developer account — on CI as much as locally
    # (ADR-0015). Developer ID signing arrives with step 13, and arrives as
    # secrets rather than as a rewrite: scripts/build-release.sh already has the
    # branch.
    #
    # ENABLE_HARDENED_RUNTIME is deliberately absent. It is a prerequisite for
    # notarization and buys nothing without it, while adding runtime restrictions
    # this build has never been tested under. Turning it on belongs with the
    # certificate that makes it mean something.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  AgentBar:
    type: application
    platform: macOS
    sources:
      - path: Apps/AgentBar
        excludes:
          - Info.plist
          - AgentBar.entitlements
          - Sounds
          - AgentBar.icon
      # UNNotificationSound resolves a bare file name against the app bundle and
      # against ~/Library/Sounds, and nowhere else — so AgentBar's own sounds
      # have to sit at the top of Contents/Resources, not in a subfolder of it.
      # A `resources` phase copies them flat, which is exactly what is wanted.
      - path: Apps/AgentBar/Sounds
        buildPhase: resources
      # The app icon is a layered Icon Composer document, not a flat PNG, so
      # macOS can render it in every appearance it now has — light, dark, the
      # tinted menu bar, and the clear treatment — instead of pasting one
      # bitmap into all of them. `type: file` because a `.icon` is a package:
      # left as a folder, XcodeGen would add its parts one by one and actool
      # would never see the document.
      - path: Apps/AgentBar/AgentBar.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AgentBar
        PRODUCT_BUNDLE_IDENTIFIER: com.molodykhvitalii.AgentBar
        INFOPLIST_FILE: Apps/AgentBar/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Apps/AgentBar/AgentBar.entitlements
        COMBINE_HIDPI_IMAGES: YES
        # Names the icon actool compiles from `AgentBar.icon`, and the value
        # `CFBundleIconName` resolves against.
        ASSETCATALOG_COMPILER_APPICON_NAME: AgentBar
        # The app is AppKit- and SwiftUI-facing throughout, so main-actor by
        # default costs nothing and removes annotation noise. Library modules
        # stay nonisolated by default; only AgentBarUI opts in, in Package.swift.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    dependencies:
      # The app links every module because it is the assembly point. Linking
      # them all now also proves the whole graph builds under Xcode, not only
      # under SwiftPM.
      - package: AgentBar
        product: AgentBarCore
      - package: AgentBar
        product: AgentBarJSON
      - package: AgentBar
        product: AgentBarIngest
      - package: AgentBar
        product: ClaudeCodeAdapter
      - package: AgentBar
        product: CodexAdapter
      - package: AgentBar
        product: CodexAppServer
      - package: AgentBar
        product: AgentBarNotifications
      - package: AgentBar
        product: AgentBarPower
      - package: AgentBar
        product: AgentBarUI
      # Codex records hook trust against the SHA of the hook definition, which
      # contains the helper's path. Shipping it at a fixed location inside the
      # bundle from the very first build keeps that path stable across updates
      # instead of re-triggering the trust prompt (step 09).
      - target: agentbar-helper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: executables

  agentbar-helper:
    type: tool
    platform: macOS
    sources:
      - Apps/agentbar-helper
    settings:
      base:
        PRODUCT_NAME: agentbar-helper
        PRODUCT_BUNDLE_IDENTIFIER: com.molodykhvitalii.AgentBar.helper
        # A hook process that must finish in single-digit milliseconds: no
        # main-actor default, and nothing linked that is not needed.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    dependencies:
      # The relay lives in CodexAdapter rather than in this target's own sources
      # so `swift test` exercises the code the hook actually runs. `main.swift`
      # is an entry point and nothing else.
      - package: AgentBar
        product: CodexAdapter

schemes:
  AgentBar:
    build:
      targets:
        AgentBar: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

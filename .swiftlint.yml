# SwiftLint covers correctness- and clarity-shaped rules; swift-format owns
# whitespace and line breaks (.swift-format). Where the two could disagree, the
# formatting rule is disabled here so `make lint` cannot demand two incompatible
# layouts.

included:
  - Sources
  - Tests
  - Apps

excluded:
  - .build
  - build
  - DerivedData
  # Generated verbatim from schemas/appserver by scripts/generate-appserver-models.py.
  # Style rules aimed at code somebody wrote — file length, nesting — say nothing
  # useful about a file whose shape is the schema's. It is still checked by
  # swift-format, so it cannot drift from the project's layout, and
  # `make check-generated` proves it still matches the schema it came from.
  - Sources/CodexAppServer/Generated

opt_in_rules:
  - array_init
  - closure_end_indentation
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - yoda_condition

disabled_rules:
  # Owned by swift-format.
  - opening_brace
  - trailing_comma
  - vertical_parameter_alignment
  # Every module deliberately begins with a header comment describing the
  # boundary it owns, which this rule reads as a missing documentation comment.
  - orphaned_doc_comment

line_length:
  warning: 100
  error: 120
  ignores_urls: true
  ignores_comments: false

file_length:
  warning: 400
  error: 600

cyclomatic_complexity:
  # An exhaustive switch over a domain enum is the compiler doing its job, not
  # tangled control flow: the point of EventKind is that every case is handled,
  # and that adding a case breaks the build until it is. Every other branch
  # still counts toward the default thresholds.
  ignores_case_statements: true

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded: [id, to, up, ok]

# A silent failure is the one thing this project cannot afford: an empty catch
# or a bare `try?` in an adapter turns a schema change into a vanished session.
force_cast: error
force_try: error
force_unwrapping: error
implicitly_unwrapped_optional: error

custom_rules:
  no_print:
    name: "No print()"
    regex: '(^|[^\w.])print\('
    match_kinds: [identifier]
    message: "Use a logger — print() is invisible to a bundled app."
    severity: error
    excluded: ".*/Tests/.*"

reporter: emoji
